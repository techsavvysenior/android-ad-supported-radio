org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Ads. Blank means Google's demo app ID and demo ad units, which is what a sample should run with.
# Real values go in ~/.gradle/gradle.properties or -P on the command line, never in this file.
# opendial.ads.network picks the demo set when units are blank: admob or admanager.
opendial.ads.network=admob
opendial.admob.appId=
opendial.ads.bannerUnit=
opendial.ads.interstitialUnit=
opendial.ads.rewardedUnit=

# Attribution. Blank turns the SDK off; the app still runs and logs events to Logcat.
opendial.appsflyer.devKey=
opendial.meta.appId=
opendial.meta.clientToken=
