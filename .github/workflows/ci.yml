name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Robolectric needs JDK 21 to run against Android 16 (SDK 36).
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Core tests (pacing, ad-free pass, events, startup gate, stations)
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :core:test
      - name: App tests (SDK constants, screenshots), lint and debug build
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Every automated use case has a test
        run: node scripts/traceability.mjs --check
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore

  screenshots:
    name: Commit README screenshots
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: docs/screenshots
      - name: Commit if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update screenshots [skip ci]"
            git push
          fi
